server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pr-acceptance-reviewer

reviewer:
  # The model that reviews. See https://platform.claude.com/docs for the list of models.
  model: ${REVIEWER_MODEL:claude-opus-5-5}
  # Cap on the model's answer.
  max-tokens: ${REVIEWER_MAX_TOKENS:16000}

logging:
  level:
    dev.gloria.pracceptance: INFO
